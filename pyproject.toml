# The scripts read data/ next to the code, so run them from a clone (see README).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-border-audit"
version = "0.4.0"
description = "AI governance measurement toolkit: which obligations apply as of a date, signed tamper-evident findings, a pluggable evaluation harness (bias / model probe / privacy / recommender), evidence intake with chain of custody, and a warrant gate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0" }
authors = [{ name = "zl1212-ship-it" }]
keywords = ["ai-governance", "algorithm-audit", "compliance", "eu-ai-act", "ll144", "bias-audit"]

dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "fpdf2>=2.7",
    "cryptography>=42.0",
    "anthropic>=0.69",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "plotly>=5.20"]

[tool.setuptools]
py-modules = [
    "accuracy_audit", "accuracy_probe", "app", "authority", "bias_audit",
    "completeness", "engine", "evaluators", "evidence", "fetch_hmda",
    "fetch_incidents", "incidents", "ingest", "ingestion", "injection_audit",
    "injection_probe", "main", "model_audit", "model_client", "monitor",
    "privacy_audit", "probe_model", "recommender_audit", "regulations", "report",
    "safety_audit", "safety_probe", "sampling", "scale", "verify_attestation",
    "verify_sources",
]
